<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Moxfield Stock Manager</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Textes : attributs data-i18n*, remplis par popup.js depuis _locales (cf. i18n.js). -->
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="22" height="22" />
      <h1>Moxfield Stock Manager</h1>
    </div>
    <span id="sync-pill" class="pill off" data-i18n="syncPillOff"></span>
  </header>
  <div class="stats">
    <div class="stat">
      <span class="stat-value" id="stock-owned">0</span>
      <span class="stat-label" data-i18n="statOwned"></span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stock-total">0</span>
      <span class="stat-label" data-i18n="statFree"></span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stock-in-decks">0</span>
      <span class="stat-label" data-i18n="statInDecks"></span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stock-count">0</span>
      <span class="stat-label" data-i18n="statDistinct"></span>
    </div>
  </div>
  <!-- Demande d'accord pour les rapports d'erreurs, tant que l'utilisateur n'a pas répondu. -->
  <section class="card" id="error-reports-consent" hidden>
    <h2 data-i18n="errorReportsConsentTitle"></h2>
    <p class="hint" data-i18n="errorReportsHint"></p>
    <div class="actions">
      <button id="error-reports-accept" class="primary" data-i18n="errorReportsAccept"></button>
      <button id="error-reports-decline" data-i18n="errorReportsDecline"></button>
    </div>
  </section>
  <section class="card">
    <h2>
      <span data-i18n="builtDecksTitle"></span> <span class="count" id="built-count">0</span>
      <span class="changed-count" id="built-changed" hidden></span>
    </h2>
    <div id="built-list" class="list"></div>
  </section>
  <section class="card">
    <details id="stock-details">
      <summary><h2 data-i18n="stockTitle"></h2></summary>
      <div class="card-body">
        <input id="stock-filter" type="search" data-i18n-placeholder="stockFilterPlaceholder" />
        <label class="check-row">
          <input type="checkbox" id="stock-only-in-decks" />
          <span data-i18n="stockOnlyInDecks"></span>
        </label>
        <p class="hint" data-i18n="stockHint"></p>
        <div id="stock-table" class="table-wrap"></div>
      </div>
    </details>
  </section>
  <section class="card">
    <details id="history-details">
      <summary><h2 data-i18n="historyTitle"></h2></summary>
      <div class="card-body">
        <p class="hint" data-i18n="historyHint"></p>
        <div id="history-list" class="list"></div>
      </div>
    </details>
  </section>

  <section class="card">
    <h2 data-i18n="collectionTitle"></h2>
    <p class="hint" data-i18n="collectionHint"></p>
    <label class="check-row">
      <input type="checkbox" id="collection-auto" />
      <span data-i18n="collectionAuto"></span>
    </label>
    <p id="collection-state" class="hint"></p>
    <p id="collection-changes" class="hint" hidden></p>
    <div id="collection-uncovered" class="notice error" hidden></div>
    <div class="actions">
      <button id="collection-fetch-btn" class="primary" data-i18n="collectionFetchNow"></button>
      <a id="collection-login-link" class="button" href="https://moxfield.com/account/signin" target="_blank" hidden data-i18n="collectionSignIn"></a>
      <span id="collection-status" class="status"></span>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="csvTitle"></h2>
    <p class="hint" data-i18n="csvHint"></p>
    <div class="file-row">
      <label class="button file-button">
        <input type="file" id="csv-file-input" accept=".csv,text/csv" hidden />
        <span data-i18n="csvChooseFile"></span>
      </label>
      <span id="csv-file-name" class="file-name" data-i18n="csvNoFile"></span>
    </div>
    <div class="actions">
      <button id="import-btn" class="primary" data-i18n="csvImport"></button>
      <span id="import-status" class="status"></span>
    </div>
    <details class="sub-details">
      <summary data-i18n="csvPasteSummary"></summary>
      <textarea id="csv-input" rows="4" placeholder="Count,Tradelist Count,Name,Edition,..."></textarea>
      <button id="import-paste-btn" class="primary" data-i18n="csvImportText"></button>
    </details>
  </section>

  <section class="card">
    <h2 data-i18n="syncTitle"></h2>

    <div id="sync-off" hidden>
      <p class="hint" data-i18n="syncOffHint"></p>
      <button id="sync-connect-btn" class="primary" data-i18n="syncConnect"></button>
    </div>

    <div id="sync-choice" hidden>
      <div class="notice warning" id="sync-choice-text"></div>
      <div class="actions">
        <button id="sync-keep-remote-btn" class="primary" data-i18n="syncKeepRemote"></button>
        <button id="sync-keep-local-btn" data-i18n="syncKeepLocal"></button>
      </div>
    </div>

    <div id="sync-account-changed" hidden>
      <div class="notice error">
        <span data-i18n="syncAccountChanged"></span>
        <strong id="sync-old-account"></strong> →
        <strong id="sync-new-account"></strong>.
        <span data-i18n="syncPaused"></span>
      </div>
      <div class="actions stacked">
        <button id="sync-account-keep-local-btn" class="primary" data-i18n="syncAccountKeepLocal"></button>
        <button id="sync-account-keep-remote-btn" data-i18n="syncAccountKeepRemote"></button>
      </div>
      <p class="hint" data-i18n="syncAccountChangedHint"></p>
    </div>

    <div id="sync-on" hidden>
      <div class="account" id="sync-account-box">
        <span class="avatar" id="sync-avatar">?</span>
        <div class="account-text">
          <span class="account-email" id="sync-account"></span>
          <span class="hint" id="sync-account-hint"></span>
        </div>
      </div>
      <p id="sync-state"></p>
      <div class="actions">
        <button id="sync-reconnect-btn" class="primary" hidden data-i18n="syncReconnect"></button>
        <button id="sync-now-btn" data-i18n="syncNow"></button>
        <button id="sync-disconnect-btn" class="ghost" data-i18n="syncDisconnect"></button>
      </div>
      <details id="sync-history" class="sub-details">
        <summary data-i18n="syncSnapshotsSummary"></summary>
        <div id="sync-snapshots" class="list"></div>
      </details>
    </div>

    <span id="sync-status" class="status"></span>
  </section>

  <section class="card">
    <details id="error-reports-details">
      <summary><h2 data-i18n="errorReportsTitle"></h2></summary>
      <div class="card-body">
        <p class="hint" data-i18n="errorReportsHint"></p>
        <label class="check-row">
          <input type="checkbox" id="error-reports-enabled" />
          <span data-i18n="errorReportsEnabled"></span>
        </label>
        <p id="error-reports-state" class="hint"></p>
      </div>
    </details>
  </section>

  <section class="card danger-zone">
    <details>
      <summary><h2 data-i18n="dangerTitle"></h2></summary>
      <div class="card-body">
        <p class="hint" data-i18n="dangerHint"></p>
        <button id="reset-btn" class="danger" data-i18n="resetButton"></button>
      </div>
    </details>
  </section>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
