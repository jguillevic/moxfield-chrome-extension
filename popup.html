<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Moxfield Stock Manager</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Textes : attributs data-i18n*, remplis par popup.js depuis _locales (cf. i18n.js). -->
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="22" height="22" />
      <!-- Nom seulement pour les lecteurs d'écran : l'icône suffit à l'œil
           (c'est celle sur laquelle on vient de cliquer dans Chrome), et le
           titre affiché faisait déborder l'en-tête en français. -->
      <h1 class="visually-hidden">Moxfield Stock Manager</h1>
    </div>
    <div class="header-tools">
      <span id="sync-pill" class="pill off" data-i18n="syncPillOff"></span>
      <!-- Aide toujours à portée (avant : lien gris en bas du popup, introuvable). -->
      <button id="help-btn" class="help-btn" aria-controls="onboarding" aria-expanded="false" data-i18n-title="helpButtonTitle"><span aria-hidden="true">?</span> <span data-i18n="helpButton"></span></button>
      <!-- Proposer une idée : toujours visible (une section repliée parmi les
           réglages, en bas du popup, n'était pas trouvée). Libellé visible
           (une ampoule seule se lit « astuce » autant qu'« idée ») ; le nom
           accessible le contient (WCAG 2.5.3). Masqué si l'envoi n'est pas
           configuré. -->
      <button id="feedback-btn" class="help-btn feedback-opener" aria-controls="feedback-panel" aria-expanded="false" data-i18n-aria-label="feedbackTitle" hidden>
        <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>
        <span data-i18n="feedbackButton"></span>
      </button>
    </div>
  </header>
  <!-- Nouvelle version sur GitHub (cf. update-check.js), affichée seulement s'il y en a une. -->
  <section class="card update-card" id="update-available" hidden>
    <h2 data-i18n="updateTitle"></h2>
    <p class="hint" id="update-summary"></p>
    <ul class="hint update-commits" id="update-commits"></ul>
    <p class="hint" data-i18n="updateHowTo"></p>
    <a id="update-link" href="https://github.com/jguillevic/moxfield-chrome-extension" target="_blank" data-i18n="updateSeeChanges"></a>
  </section>
  <!-- Aide : premiers pas cochés d'après l'état réel (nouvelle installation)
       et légende des boutons ; rouverte par « Aide » dans l'en-tête. -->
  <section class="card onboarding-card" id="onboarding" aria-labelledby="onboarding-title" hidden>
    <div class="onboarding-head">
      <h2 id="onboarding-title" tabindex="-1" data-i18n="onboardingTitle"></h2>
      <span id="onboarding-progress" class="onboarding-progress" aria-live="polite"></span>
    </div>
    <ol id="onboarding-tasks" class="onboarding-tasks"></ol>
    <p id="onboarding-all-done" class="onboarding-status done" data-i18n="onboardingAllDone" hidden></p>
    <details id="onboarding-legend" class="sub-details">
      <summary data-i18n="legendTitle"></summary>
      <div id="onboarding-legend-body"></div>
    </details>
    <!-- C'est dans l'aide qu'on cherche quand on est bloqué. -->
    <p class="hint feedback-help-line" id="feedback-help-line" hidden>
      <span data-i18n="feedbackHelpPrompt"></span>
      <button class="link-button feedback-opener" aria-controls="feedback-panel" aria-expanded="false" data-i18n="feedbackHelpLink"></button>
    </p>
    <div class="actions">
      <button id="onboarding-close"></button>
    </div>
  </section>
  <!-- Proposer une idée : panneau affiché à la demande, en tête du popup
       (cf. handleSendFeedback dans background.js). Ne prend aucune place
       au quotidien ; pas un réglage, donc pas parmi les réglages. -->
  <section class="card feedback-card" id="feedback-panel" aria-labelledby="feedback-title" hidden>
    <h2 id="feedback-title" data-i18n="feedbackTitle"></h2>
    <div id="feedback-form">
      <p class="hint" data-i18n="feedbackHint"></p>
      <label class="field-label" for="feedback-message" data-i18n="feedbackMessageLabel"></label>
      <!-- Pas de maxlength : un texte collé trop long serait coupé sans rien
           dire ; la limite est annoncée (compteur) et vérifiée. -->
      <textarea id="feedback-message" class="feedback-message" rows="5" data-i18n-placeholder="feedbackPlaceholder" aria-describedby="feedback-count"></textarea>
      <p id="feedback-count" class="field-note" hidden></p>
      <label class="field-label" for="feedback-email" data-i18n="feedbackEmailLabel"></label>
      <input id="feedback-email" type="email" autocomplete="email" aria-describedby="feedback-email-error feedback-email-kept" />
      <p id="feedback-email-error" class="field-note error" hidden></p>
      <p id="feedback-email-kept" class="field-note" data-i18n="feedbackEmailKept"></p>
      <div class="actions">
        <button id="feedback-send-btn" class="primary" data-i18n="feedbackSend"></button>
        <button id="feedback-close-btn" data-i18n="close"></button>
      </div>
      <!-- Raison du bouton désactivé, visible (charte : pas seulement un title). -->
      <p id="feedback-reason" class="hint"></p>
      <p id="feedback-error" class="notice error" role="alert" hidden></p>
      <p class="hint" data-i18n="feedbackPrivacy"></p>
    </div>
    <!-- Après l'envoi : une confirmation à la place du formulaire (vider le
         formulaire sur place affichait « Écris ton idée… » sous le merci). -->
    <div id="feedback-done" hidden>
      <p id="feedback-done-text" class="feedback-done-text" role="status" tabindex="-1"></p>
      <div class="actions">
        <button id="feedback-done-close-btn" class="primary" data-i18n="close"></button>
        <button id="feedback-another-btn" data-i18n="feedbackAnother"></button>
      </div>
    </div>
  </section>
  <!-- Rien à compter encore : un message plutôt que quatre zéros. -->
  <p class="card hint stats-empty" id="stats-empty" data-i18n="statsEmpty" hidden></p>
  <div class="stats" id="stats">
    <div class="stat">
      <span class="stat-value" id="stock-owned">0</span>
      <span class="stat-label" data-i18n="statOwned"></span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stock-total">0</span>
      <span class="stat-label" data-i18n="statFree"></span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stock-in-decks">0</span>
      <span class="stat-label" data-i18n="statInDecks"></span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stock-count">0</span>
      <span class="stat-label" data-i18n="statDistinct"></span>
    </div>
  </div>
  <section class="card">
    <h2>
      <span data-i18n="builtDecksTitle"></span> <span class="count" id="built-count">0</span>
      <span class="changed-count" id="built-changed" hidden></span>
    </h2>
    <div id="built-list" class="list"></div>
    <p id="built-status" class="hint" role="status"></p>
  </section>
  <!-- Mes decks : faisabilité de plusieurs decks sans les ouvrir (cf. handleGetDecks dans background.js). -->
  <section class="card">
    <details id="decks-details">
      <summary><h2 data-i18n="decksTitle"></h2></summary>
      <div class="card-body">
        <p class="hint" data-i18n="decksHint"></p>
        <div class="deck-add-row">
          <input id="deck-add-input" type="text" data-i18n-placeholder="decksAddPlaceholder" />
          <button id="deck-add-btn" data-i18n="decksAdd"></button>
        </div>
        <div class="actions">
          <button id="decks-refresh-btn" data-i18n="decksRefresh"></button>
          <span id="decks-status" class="status" role="status"></span>
        </div>
        <div id="decks-list" class="list"></div>
        <div id="shopping-list" class="shopping-list"></div>
      </div>
    </details>
  </section>
  <section class="card">
    <details id="stock-details">
      <summary><h2 data-i18n="stockTitle"></h2></summary>
      <div class="card-body">
        <input id="stock-filter" type="search" data-i18n-placeholder="stockFilterPlaceholder" />
        <label class="check-row">
          <input type="checkbox" id="stock-only-in-decks" />
          <span data-i18n="stockOnlyInDecks"></span>
        </label>
        <p class="hint" data-i18n="stockHint"></p>
        <div id="stock-table" class="table-wrap"></div>
      </div>
    </details>
  </section>
  <section class="card">
    <details id="history-details">
      <summary><h2 data-i18n="historyTitle"></h2></summary>
      <div class="card-body">
        <p class="hint" data-i18n="historyHint"></p>
        <div id="history-list" class="list"></div>
      </div>
    </details>
  </section>

  <section class="card">
    <h2 data-i18n="collectionTitle"></h2>
    <p class="hint" data-i18n="collectionHint"></p>
    <label class="check-row">
      <input type="checkbox" id="collection-auto" />
      <span data-i18n="collectionAuto"></span>
    </label>
    <p id="collection-state" class="hint"></p>
    <p id="collection-changes" class="hint" hidden></p>
    <div id="collection-uncovered" class="notice error" hidden></div>
    <div class="actions">
      <button id="collection-fetch-btn" class="primary" data-i18n="collectionFetchNow"></button>
      <a id="collection-login-link" class="button" href="https://moxfield.com/account/signin" target="_blank" hidden data-i18n="collectionSignIn"></a>
      <span id="collection-status" class="status" role="status"></span>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="csvTitle"></h2>
    <p class="hint" data-i18n="csvHint"></p>
    <div class="file-row">
      <label class="button file-button">
        <input type="file" id="csv-file-input" class="visually-hidden" accept=".csv,text/csv" />
        <span data-i18n="csvChooseFile"></span>
      </label>
      <span id="csv-file-name" class="file-name" data-i18n="csvNoFile"></span>
    </div>
    <div class="actions">
      <button id="import-btn" class="primary" data-i18n="csvImport"></button>
      <span id="import-status" class="status" role="status"></span>
    </div>
    <details class="sub-details">
      <summary data-i18n="csvPasteSummary"></summary>
      <textarea id="csv-input" rows="4" placeholder="Count,Tradelist Count,Name,Edition,..."></textarea>
      <button id="import-paste-btn" class="primary" data-i18n="csvImportText"></button>
    </details>
  </section>

  <section class="card">
    <h2 data-i18n="syncTitle"></h2>

    <div id="sync-off" hidden>
      <p class="hint" data-i18n="syncOffHint"></p>
      <button id="sync-connect-btn" class="primary" data-i18n="syncConnect"></button>
    </div>

    <div id="sync-choice" hidden>
      <div class="notice warning" id="sync-choice-text"></div>
      <div class="actions">
        <button id="sync-keep-remote-btn" class="primary" data-i18n="syncKeepRemote"></button>
        <button id="sync-keep-local-btn" data-i18n="syncKeepLocal"></button>
      </div>
    </div>

    <div id="sync-account-changed" hidden>
      <div class="notice error">
        <span data-i18n="syncAccountChanged"></span>
        <strong id="sync-old-account"></strong> →
        <strong id="sync-new-account"></strong>.
        <span data-i18n="syncPaused"></span>
      </div>
      <div class="actions stacked">
        <button id="sync-account-keep-local-btn" class="primary" data-i18n="syncAccountKeepLocal"></button>
        <button id="sync-account-keep-remote-btn" data-i18n="syncAccountKeepRemote"></button>
      </div>
      <p class="hint" data-i18n="syncAccountChangedHint"></p>
    </div>

    <div id="sync-on" hidden>
      <div class="account" id="sync-account-box">
        <span class="avatar" id="sync-avatar">?</span>
        <div class="account-text">
          <span class="account-email" id="sync-account"></span>
          <span class="hint" id="sync-account-hint"></span>
        </div>
      </div>
      <p id="sync-state"></p>
      <div class="actions">
        <button id="sync-reconnect-btn" class="primary" hidden data-i18n="syncReconnect"></button>
        <button id="sync-now-btn" data-i18n="syncNow"></button>
        <button id="sync-disconnect-btn" class="ghost" data-i18n="syncDisconnect"></button>
      </div>
      <p class="hint">
        <span data-i18n="syncBackupHint"></span>
        <a href="https://drive.google.com/drive/settings" target="_blank" data-i18n="syncDriveLink"></a>
      </p>
      <div class="actions">
        <button id="sync-download-btn" data-i18n="syncDownload"></button>
      </div>
      <details id="sync-history" class="sub-details">
        <summary data-i18n="syncSnapshotsSummary"></summary>
        <div id="sync-snapshots" class="list"></div>
      </details>
    </div>

    <span id="sync-status" class="status" role="status"></span>
  </section>

  <section class="card">
    <details id="error-reports-details">
      <summary><h2 data-i18n="errorReportsTitle"></h2></summary>
      <div class="card-body">
        <p class="hint" data-i18n="errorReportsHint"></p>
        <label class="check-row">
          <input type="checkbox" id="error-reports-enabled" />
          <span data-i18n="errorReportsEnabled"></span>
        </label>
        <p id="error-reports-state" class="hint"></p>
      </div>
    </details>
  </section>

  <section class="card danger-zone">
    <details>
      <summary><h2 data-i18n="dangerTitle"></h2></summary>
      <div class="card-body">
        <p class="hint" data-i18n="dangerHint"></p>
        <button id="reset-btn" class="danger" data-i18n="resetButton"></button>
        <p id="reset-status" class="hint" role="status"></p>
      </div>
    </details>
  </section>

  <!-- Version de l'extension (manifest) et commit du clone. -->
  <footer class="app-footer">
    <span id="feedback-footer" hidden>
      <button id="feedback-open-btn" class="link-button feedback-opener" aria-controls="feedback-panel" aria-expanded="false" data-i18n="feedbackOpen"></button>
      <span aria-hidden="true">·</span>
    </span>
    <a id="version-link" href="https://github.com/jguillevic/moxfield-chrome-extension" target="_blank"></a>
  </footer>

  <script src="i18n.js"></script>
  <script src="deck-checks.js"></script>
  <script src="deck-help.js"></script>
  <script src="error-reports.js"></script>
  <script src="popup.js"></script>
</body>
</html>
