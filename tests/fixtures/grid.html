<!doctype html>
<!-- Vue « Visual Grid » : structure reprise d'une copie HTML réelle.
     div.decklist-card[data-hash] par carte, quantité dans un <input> (« x »
     + value, absente du texte), nom en texte (face avant seulement pour une
     double face) et nom complet dans l'alt de l'image. Contient aussi un reste
     caché d'une autre vue, à ignorer. -->
<html><body>
<select name="viewMode" id="viewMode"><option value="table">Text</option><option value="condensedTable">Condensed Text</option><option value="visual">Visual Grid</option><option value="stacks">Visual Stacks</option><option value="splitStacks">Visual Stacks (Split)</option><option value="spoiler">Visual Spoiler</option></select>
<div class="row">
  <div class="col-auto"><ul><div class="decklist-image-container">
    <div data-hash="E0aWJ" class="decklist-card">
      <div class="decklist-card-phantomsearch">Sidisi, Brood Tyrant</div>
      <div class="decklist-card-collection"><a id="collection_full_1025_commanders_E0aWJ" class="fa-stack"><span aria-label="Found in collection"></span></a></div>
      <div class="decklist-card-quantity show-on-hover"><span>x</span><input type="text" value="1" readonly></div>
      <div><div id="vd-E0aWJ" class="img-card-visual"><img alt="Sidisi, Brood Tyrant" class="img-card" src="card-E0aWJ.webp"></div></div>
    </div>
  </div></ul></div>
  <div class="col-auto"><ul><div class="decklist-image-container">
    <div data-hash="EZA0w" class="decklist-card">
      <div class="decklist-card-phantomsearch">Birds of Paradise</div>
      <div class="decklist-card-collection"><a id="collection_pt_1027_mainboard_EZA0w" class="fa-stack"><span aria-label="Partially in collection"></span></a></div>
      <div class="decklist-card-quantity show-on-hover"><span>x</span><input type="text" value="1"></div>
      <div><div id="vd-EZA0w" class="img-card-visual"><img alt="Birds of Paradise" class="img-card" src="card-EZA0w.webp"></div></div>
    </div>
    <div data-hash="xRXAR" class="decklist-card">
      <div class="decklist-card-phantomsearch is-modal">Revitalizing Repast</div>
      <div class="decklist-card-collection"><a id="collection_full_1043_mainboard_xRXAR" class="fa-stack"><span aria-label="Found in collection"></span></a></div>
      <div class="decklist-card-quantity show-on-hover"><span>x</span><input type="text" value="1"></div>
      <div><div id="vd-xRXAR" class="img-card-visual"><img alt="Revitalizing Repast // Old-Growth Grove" class="img-card" src="card-face-Yxo4R.webp"><a><div id="id1044-transform-xRXAR" class="img-card-flip"><span aria-label="Transform"></span></div></a></div></div>
    </div>
    <div data-hash="ZOwRDF0" class="decklist-card">
      <div class="decklist-card-phantomsearch">Golgari Thug</div>
      <div class="decklist-card-collection"><a id="collection_full_1063_mainboard_ZOwRD" class="fa-stack"><span aria-label="Found in collection"></span></a></div>
      <div class="decklist-card-quantity show-on-hover"><span>x</span><input type="text" value="1" name="ZOwRDF0"></div>
      <div><div id="vd-ZOwRDF0" class="img-card-visual img-card-foil"><img alt="Golgari Thug" class="img-card" src="card-ZOwRD.webp"></div></div>
    </div>
  </div></ul></div>
  <div class="col-auto"><ul><div class="decklist-image-container">
    <div data-hash="SWAMP1" class="decklist-card">
      <div class="decklist-card-phantomsearch">Swamp</div>
      <div class="decklist-card-collection"><a id="collection_full_1080_mainboard_SWAMP1" class="fa-stack"><span aria-label="Found in collection"></span></a></div>
      <div class="decklist-card-quantity show-on-hover"><span>x</span><input type="text" value="3"></div>
      <div><div id="vd-SWAMP1" class="img-card-visual"><img alt="Swamp" class="img-card" src="card-SWAMP1.webp"></div></div>
    </div>
  </div></ul></div>
</div>
<div style="display: none">
  <div data-hash="OLDSOL" class="decklist-card">
    <div class="decklist-card-phantomsearch">Sol Ring</div>
    <div class="decklist-card-quantity"><span>x</span><input type="text" value="1"></div>
  </div>
</div>
<footer><div>7 main deck</div><div>0 sideboard</div></footer>
</body></html>
