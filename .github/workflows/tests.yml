# Tests automatisés (npm test) à chaque push, sur toutes les branches : une
# branche de travail est vérifiée avant d'arriver sur main.
name: Tests

on:
  push:
    # Toutes les branches, mais pas les tags (un tag pointe sur un commit
    # déjà testé sur sa branche).
    branches: ["**"]
  # Lancement à la main depuis l'onglet Actions de GitHub.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # jsdom 30 demande Node ^22.22.2 ou ^24.15.0.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
